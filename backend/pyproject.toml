[project]
name = "sigf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0,<5.3",
  "djangorestframework>=3.15",
  "psycopg[binary]>=3.1",
  "django-environ>=0.11",
  "openpyxl>=3.1",
  "pypdf>=4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.8", "pytest-cov>=5",
       "hypothesis>=6", "model-bakery>=1.17", "ruff>=0.4"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = "test_*.py"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# DJ001 : en comptabilité, NULL signifie « axe non imputé » et se distingue
# sémantiquement de la chaîne vide. Les agrégations du moteur d'états
# s'appuient sur cette distinction. Choix assumé, pas un oubli.
ignore = ["DJ001"]
