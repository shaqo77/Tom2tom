name: CI
on:
  # Économie de quota : une seule exécution par PR (pas de second passage au push sur `main`),
  # aucune exécution pour une PR qui ne touche que la documentation, lancement manuel possible.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  # Un nouveau push sur la même PR annule l'exécution devenue inutile.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-backend:
    name: tests backend (${{ matrix.groupe }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        groupe: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigf
          POSTGRES_USER: sigf_owner
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 20
        ports: ["5432:5432"]
    env:
      SECRET_KEY: ci-only
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://sigf_app:ci@localhost:5432/sigf
      DATABASE_OWNER_URL: postgres://sigf_owner:ci@localhost:5432/sigf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Dépendances
        working-directory: backend
        run: uv venv --python 3.12 .venv && uv pip install -r pyproject.toml --group dev
      - name: Amorcer le cluster
        run: |
          scripts/bootstrap_db.sh
          # La suite de tests crée sa propre base : ce droit lui est propre et
          # n'appartient pas à l'amorçage, qui décrit un cluster de service.
          PGPASSWORD=ci psql -h localhost -U sigf_owner -d sigf -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE sigf_app CREATEDB;
                GRANT CONNECT ON DATABASE sigf TO sigf_app;
                GRANT USAGE ON SCHEMA public TO sigf_app;
                ALTER DEFAULT PRIVILEGES FOR ROLE sigf_owner IN SCHEMA public
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sigf_app;
                ALTER DEFAULT PRIVILEGES FOR ROLE sigf_owner IN SCHEMA public
                  GRANT USAGE, SELECT ON SEQUENCES TO sigf_app;"
      - name: Style
        if: matrix.groupe == 1
        working-directory: backend
        run: ./.venv/bin/ruff check . && ./.venv/bin/ruff format --check .
      - name: Migrations
        if: matrix.groupe == 1
        working-directory: backend
        run: ./.venv/bin/python manage.py migrate --settings=config.settings.migrate
      - name: Tests (groupe ${{ matrix.groupe }} sur 6)
        working-directory: backend
        env:
          COVERAGE_FILE: .coverage.${{ matrix.groupe }}
        run: |
          fichiers=$(python3 ci/repartir_tests.py ${{ matrix.groupe }} 6)
          ./.venv/bin/pytest -q --cov=. $fichiers
      - uses: actions/upload-artifact@v4
        with:
          name: couverture-${{ matrix.groupe }}
          path: backend/.coverage.${{ matrix.groupe }}
          include-hidden-files: true

  # Le contrôle `backend` garde son nom : c'est lui que la protection de `main` attend.
  backend:
    needs: tests-backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        if: needs.tests-backend.result == 'success'
        with:
          pattern: couverture-*
          path: backend/couvertures
          merge-multiple: true
      - name: Couverture cumulée
        if: needs.tests-backend.result == 'success'
        working-directory: backend
        run: |
          uv venv --python 3.12 .venv && uv pip install coverage
          ./.venv/bin/coverage combine couvertures/.coverage.*
          ./.venv/bin/coverage report --skip-covered | tail -5
      - name: Résultat des groupes
        run: |
          echo "tests-backend : ${{ needs.tests-backend.result }}"
          test "${{ needs.tests-backend.result }}" = "success"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Style
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Construction
        run: npm run build
